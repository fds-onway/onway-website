name: Website Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'docker-compose.yaml'
  workflow_dispatch:

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Create .env file
        run: echo "VITE_API_URL=${{ vars.API_URL }}" > .env

  imported-workflow:
    name: Deploy
    needs: set-env
    uses: fds-onway/onway-infra/.github/workflows/bucket_website_deploy.yaml@main
    with:
      bucket_name: 'www.crassus.app.br'
    secrets: inherit